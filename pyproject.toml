[project]
name = "hexcoach-backend"
version = "0.1.0"
description = "TFT Set 18 coaching backend: constrained search + multi-source TensorFlow ranker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pytest>=8,<9",
  "tensorflow>=2.18,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
